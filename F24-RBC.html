        @import url('https://fonts.googleapis.com/css?family=Karla:400,700&display=swap');

        .font-family-karla {
            font-family: karla;
        }

        /* Three image containers (use 25% for four, and 50% for two, etc) */
        .column {
            float: left;
            align-items: center;
            display: flex;
            /* position: relative; */
            /* width: 50%; */
            height: 10%;
            padding-left: 25px;

        }
        .pic {
            float: left;
            padding: 5px;
            margin-left: 15px ;
            margin-right: 15px;
        }

        /* Clear floats after image containers */
        .row {
            content: "";
            clear: both;
            display: table;
        }


        .image-container {
            display: flex;
            justify-content: space-between; /* optional: to add space between images */
            align-items: center;
            flex-wrap: wrap;
            margin-bottom:20px;
            margin-top:50px;
        }
        .image-container img {
            max-width: 100%;
            height: auto;
            height: 400px; 
            width: auto; 
        }


        .image-row {
            display: grid;
            grid-template-columns: repeat(3, 300px); /* Create 3 columns of fixed width */
            gap: 10px; /* Optional: Adjust spacing between images */
        }

        .image-row img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        

        .image-container2 {
            position: relative;
            width: auto; /* Let the width be dynamic */
            height: 400px; /* Set a fixed height for all images */
            overflow: hidden;
            justify-content: space-between; /* optional: to add space between images */
        }

        .image-container2 img {
            position: absolute;
            top: 50%;
            left: 50%;
            height: 100%; /* Set the height of the image to fill the container */
            width: 100%; /* Allow the width to maintain the aspect ratio */
            transform: translate(-50%, -50%); /* Center the image in the container */
            object-fit: contain; /* Ensure the image fits while maintaining aspect ratio */
        }

        
        #main-container {
            min-height: 400px;
            margin: 0px 100px 10px 100px;
            padding: 50px;
            background-color: cornflowerblue;
            /* border: 2px solid #000; */
            overflow: auto;
        }


    </style>
